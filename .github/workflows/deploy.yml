# On every push to main: build the site and upload it to the STRATO web space via SFTP.
# Requires: secrets STRATO_SFTP_HOST, STRATO_SFTP_USER, STRATO_SFTP_PASSWORD;
#   optional variable STRATO_SFTP_DIR (default "/" = the SFTP user's own folder, here /web).
# Test address: dev.therapie-n25.de (points to /web; hidden from search engines via .htaccess).
name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

# never cancel a running upload; a newer push waits and then deploys
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check the build
        run: |
          test -f dist/index.html && test -f dist/404.html && test -f dist/.htaccess
          ! grep -q 'name="robots" content="noindex' dist/index.html
          grep -q 'https://www.therapie-n25.de/' dist/sitemap.xml
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - name: Upload to STRATO via SFTP
        env:
          SFTP_HOST: ${{ secrets.STRATO_SFTP_HOST }}
          SFTP_USER: ${{ secrets.STRATO_SFTP_USER }}
          LFTP_PASSWORD: ${{ secrets.STRATO_SFTP_PASSWORD }}
          SFTP_DIR: ${{ vars.STRATO_SFTP_DIR }}
        run: scripts/deploy-sftp.sh
