# Builds the Astro site and publishes it on GitHub Pages.
# Requires: Settings → Pages → Build and deployment → Source: "GitHub Actions".
# Without a custom domain the site is at https://k-it-ai.github.io/therapie-n25/ (hidden from search engines).
# Once a custom domain is set in Settings → Pages, the next run builds for that domain automatically.
name: Deploy preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          PUBLIC_NOINDEX: ${{ endsWith(steps.pages.outputs.host, 'github.io') }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
